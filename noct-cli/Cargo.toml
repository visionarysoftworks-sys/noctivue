[package]
name = "noct-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "noct — the Noctivue command-line toolchain (run, test, build, fmt, lint, …)"

[[bin]]
name = "noct"
path = "src/main.rs"

[dependencies]
compiler = { path = "../compiler" }
ed25519-dalek = "3.0.0"
interp    = { path = "../interp" }
# Not `use`d in Rust source: `noct build` links it into the shim crate via
# a path dependency (see cmd_build.rs). Declared so the requirement breaks
# loudly at resolve time if the crate ever moves, not mid-link.
runtime-native = { path = "../runtime-native" }
sha2 = "0.11.0"
